[[repos]]
repo = "local"
hooks = [
  { id = "actionlint", name = "actionlint", entry = "actionlint", language = "system", files = '\.github/workflows/.*\.(yaml|yml)$' },
  { id = "pinact", name = "pinact", entry = "pinact run", language = "system", files = '\.github/workflows/.*\.(yaml|yml)$' },
  { id = "rumdl", name = "rumdl", entry = "rumdl check", language = "system", files = '\.md$' },
  { id = "editorconfig-checker", name = "editorconfig-checker", entry = "ec", language = "system" },
]